<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div>
                <h3 class="home">HOME</h3>
                <div>
                    <p class="scoreH" id="homeScore">0</p>
                    <div class="buttonH">
                        <button onclick="incOneHome()">+1</button>
                        <button onclick="incTwoHome()">+2</button>
                        <button onclick="incThreeHome()">+3</button>
                    </div>
                </div>
            </div>
            <div>
                <h3 class="guest">GUEST</h3>
                <div>
                    <p class="scoreG" id="guestScore">0</p>
                    <div class="buttonG">
                        <button onclick="incOneGuest()">+1</button>
                        <button onclick="incTwoGuest()">+2</button>
                        <button onclick="incThreeGuest()">+3</button>
                    </div>
                </div>
            </div>
            <button class="reset" onclick="resetScore()">Reset</button>
        </div>
        <script src="index.js"></script>
    </body>
</html>
